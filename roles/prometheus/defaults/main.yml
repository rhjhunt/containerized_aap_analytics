---
### podman
podman_log_driver: journald

### common
analytics_volumes_dir: "{{ ansible_user_dir }}/analytics"

### prometheus
prometheus_admin_user: admin
prometheus_admin_email: admin@example.com
prometheus_firewall_zone: public
prometheus_data_dir: "{{ analytics_volumes_dir }}/prometheus/data"
prometheus_conf_dir: "{{ analytics_volumes_dir }}/prometheus/etc"
prometheus_container_label: level:s0:c100,c200
prometheus_port: 9090
...
